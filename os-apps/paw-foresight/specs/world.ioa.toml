# World — root of a scored world: one domain, one horizon, one living future.
#
# A World is built by the corridor (ADR-002): a surveyor records determined
# facts as EventNodes (the skeleton), endpoint writers produce documents
# native to the target date, repairers connect them backward to the skeleton,
# adversaries attack the repairs, and aggregate_costs weighs the surviving
# paths. Near-term claims implied by weighted paths are registered as
# Forecast entities; as reality resolves them the world updates and its
# artifacts are retconned.
#
# Lifecycle:
#   Configure (self-loop on Created) → Seed → (seed_world) → Seeding
#   → surveyor/bookmaker self-report SeedComplete → Active
#   → SampleEndpoints → (sample_endpoints) → endpoint writers spawn
#   → paths repair/challenge/score per Endpoint/Path machinery
#   → PathsScored → (register_forecasts) → forecasts preregistered
#   → IngestEvidence (event-driven; feeds resolve EventNodes)
#   → BeginUpdate when drift demands re-solving → Updating → UpdateComplete

[automaton]
name = "World"
states = ["Created", "Seeding", "Active", "Updating", "OpeningReplay", "Archived", "Failed"]
initial = "Created"
strict_action_params = true

# ADR-0050/ADR-007: Created awaits human/agent configuration (no deadline by
# design). Active is the steady state of a living world — indefinite by
# definition, with the reconcile timeout below guarding missed aggregate flow.
# Seeding self-heals: a surveyor that completes or stalls without SeedComplete
# re-enters seed_world instead of wedging the world.
allow_indefinite_states = ["Created", "Active", "Updating"]

[[state_timeout]]
state = "Seeding"
after_seconds = 1200
on_timeout = "ResumeSeed"
reset_on = ["SeedComplete", "Fail", "ResumeSeed"]

# Self-heal (ADR-007): when every claim is terminal but canonical_path_id is still
# empty — e.g. the last claim resolved off the Bridging settle path (operator
# MarkUnreachable, or a wedged route) — re-run the world aggregate. reset_on
# PathsScored so a scored world is not re-polled.
[[state_timeout]]
state = "Active"
after_seconds = 600
on_timeout = "ResumeWorldCascade"
reset_on = ["PathsScored", "BeginUpdate"]

# --- State Variables ---

[[state]]
name = "name"
type = "string"
initial = ""

[[state]]
name = "domain"
type = "string"
initial = ""

[[state]]
name = "description"
type = "string"
initial = ""

[[state]]
name = "horizon_months"
type = "string"
initial = ""

[[state]]
name = "target_date"
type = "string"
initial = ""

# Claims resolving before this date are scoreable (registered as Forecasts);
# beyond it the world is structured speculation. Maintained by evidence_ingest.
[[state]]
name = "frontier_date"
type = "string"
initial = ""

[[state]]
name = "corpus_file_id"
type = "string"
initial = ""

[[state]]
name = "graph_snapshot_file_id"
type = "string"
initial = ""

# Driver basis for endpoint sampling: paw-fs JSON of named drivers and the
# value spread the solver assigns across endpoint writers (anti-modal).
[[state]]
name = "driver_config_file_id"
type = "string"
initial = ""

# Lag-distribution table consulted by aggregate_costs (clock data).
[[state]]
name = "lag_table_file_id"
type = "string"
initial = ""

[[state]]
name = "endpoint_budget"
type = "string"
initial = "3"

[[state]]
name = "token_budget_cents"
type = "string"
initial = ""

[[state]]
name = "agent_model"
type = "string"
initial = ""

[[state]]
name = "agent_provider"
type = "string"
initial = ""

# Hindcast worlds run from a frozen past vantage: web tools are stripped from
# every spawned session and evidence_ingest reads only the frozen corpus.
[[state]]
name = "hindcast_mode"
type = "string"
initial = "false"

[[state]]
name = "skeleton_node_count"
type = "string"
initial = "0"

# ADR-006: the surveyor's named uncertainty axes — JSON array of
# {"axis": "...", "consensus_pole": "..."}. sample_endpoints assigns each
# anti-modal world a different named axis to invert, so the diverse worlds are
# distinct by construction (not just generic percentile stances).
[[state]]
name = "uncertainty_axes"
type = "string"
initial = "[]"

[[state]]
name = "canonical_path_id"
type = "string"
initial = ""

# The as-of date of the most recent evidence ingest. Supplied by the caller
# of IngestEvidence: WASM has no clock, so the date is data, not ambient time.
[[state]]
name = "last_ingest_date"
type = "string"
initial = ""

[[state]]
name = "update_cause_node_id"
type = "string"
initial = ""

# Living-worlds state (ADR-004 C4): cast personas, created dweller ids, and
# the bounded fan-out cursor for SpawnNextDweller.
[[state]]
name = "personas_json"
type = "string"
initial = "[]"

[[state]]
name = "dweller_ids"
type = "string"
initial = "[]"

[[state]]
name = "check_count"
type = "string"
initial = "0"

# ADR-006: how many diversity-gate rounds this pass has run. Bounds the
# re-steer loop — after the cap, the gate discards persistent near-duplicates
# rather than re-steering forever.
[[state]]
name = "gate_rounds"
type = "string"
initial = "0"

[[state]]
name = "last_adjudication_date"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "Configure"
kind = "input"
from = ["Created"]
params = ["name", "domain", "description", "horizon_months", "target_date", "frontier_date", "corpus_file_id", "driver_config_file_id", "lag_table_file_id", "endpoint_budget", "token_budget_cents", "agent_model", "agent_provider", "hindcast_mode"]
hint = "Configure world parameters. Self-loop on Created."

[[action]]
name = "Seed"
kind = "input"
from = ["Created"]
to = "Seeding"
params = []
hint = "Begin skeleton construction. Spawns surveyor and bookmaker sessions."
effect = [{ type = "trigger", name = "seed_world" }]

[[action.triggers]]
name = "seed_world"
kind = "wasm"
module = "seed_world"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "SeedComplete"
kind = "input"
from = ["Seeding"]
to = "Active"
params = ["skeleton_node_count", "graph_snapshot_file_id", "uncertainty_axes"]
hint = "Surveyor self-reports the skeleton is recorded plus the named uncertainty axes (ADR-006). World becomes active."

[[action]]
name = "ResumeSeed"
kind = "input"
from = ["Seeding"]
to = "Seeding"
params = []
hint = "Self-heal: re-spawn the surveyor/bookmaker batch when Seeding did not receive SeedComplete. System principals only."
effect = [{ type = "trigger", name = "seed_world" }]

[[action.triggers]]
name = "seed_world"
kind = "wasm"
module = "seed_world"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "SampleEndpoints"
kind = "input"
from = ["Active"]
params = []
hint = "Start a corridor pass: spawn endpoint-writer sessions under assigned driver configurations."
effect = [{ type = "trigger", name = "sample_endpoints" }]

[[action.triggers]]
name = "sample_endpoints"
kind = "wasm"
module = "sample_endpoints"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


# ADR-006: the diversity gate. Dispatched by the all-written barrier (in
# sample_endpoints, on Endpoint.BundleWritten) once every endpoint has a
# bundle. Re-enters sample_endpoints to embed the written worlds, release the
# diverse ones into repair (Endpoint.SubmitForRepair) and re-steer the
# collapsed ones (Endpoint.ReSteer). gate_rounds bounds the loop. System only.
[[action]]
name = "GateDiversity"
kind = "input"
from = ["Active"]
params = ["gate_rounds"]
hint = "Run the diversity gate over the written worlds (ADR-006). System principals only."
effect = [{ type = "trigger", name = "sample_endpoints" }]

[[action.triggers]]
name = "sample_endpoints"
kind = "wasm"
module = "sample_endpoints"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"
embedding_endpoint = "{secret:embedding_endpoint}"
embedding_model = "{secret:embedding_model}"


[[action]]
name = "EndpointsSampled"
kind = "input"
from = ["Active"]
params = []
hint = "Callback after endpoint writers are spawned. Corridor proceeds per Endpoint/Path machinery."

# Self-heal (ADR-007): the Active state_timeout fires this when all claims are
# terminal but canonical_path_id is still empty. Re-runs aggregate_costs'
# world cascade (ScoreComplete per endpoint + PathsScored). System principals
# only (timeout-dispatched).
[[action]]
name = "ResumeWorldCascade"
kind = "input"
from = ["Active"]
to = "Active"
params = []
hint = "Self-heal: re-run world aggregate when claims are settled but canonical_path_id is unset. Fires on the Active state_timeout."
effect = [{ type = "trigger", name = "aggregate_costs_world_cascade" }]

[[action.triggers]]
name = "aggregate_costs_world_cascade"
kind = "wasm"
module = "aggregate_costs"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "PathsScored"
kind = "input"
from = ["Active"]
params = ["canonical_path_id"]
hint = "aggregate_costs classified all paths for this pass. Registers implied near-term forecasts."
effect = [{ type = "trigger", name = "register_forecasts" }]

[[action.triggers]]
name = "register_forecasts"
kind = "wasm"
module = "register_forecasts"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "IngestEvidence"
kind = "input"
from = ["Active"]
params = ["last_ingest_date"]
hint = "Pull evidence feeds, snapshot them to paw-fs, update EventNode probabilities, resolve due nodes, grade forecasts. The caller supplies the as-of date (last_ingest_date): WASM has no clock — the date is data."
effect = [{ type = "trigger", name = "evidence_ingest" }]

[[action.triggers]]
name = "evidence_ingest"
kind = "wasm"
module = "evidence_ingest"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "Render"
kind = "input"
from = ["Active"]
params = []
hint = "Spawn renderer/dweller sessions to draft artifacts from canonical and tail paths."
effect = [{ type = "trigger", name = "render_artifacts" }]

[[action.triggers]]
name = "render_artifacts"
kind = "wasm"
module = "render_artifacts"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "AnimateDwellers"
kind = "input"
from = ["Active"]
params = []
hint = "Spawn the casting session: 2-3 personas grounded in the settled claims. Dwellers traverse the canonical routes, file contradictions, and write first-person stories through the gate."
effect = [{ type = "trigger", name = "animate_dwellers" }]

[[action.triggers]]
name = "animate_dwellers"
kind = "wasm"
module = "animate_dwellers"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "DwellersCast"
kind = "input"
from = ["Active"]
params = ["personas_json"]
hint = "Casting session self-reports the proposed personas. Re-enters animate_dwellers to create Dweller entities and start the chunked traversal fan-out."
effect = [{ type = "trigger", name = "animate_dwellers" }]

[[action.triggers]]
name = "animate_dwellers"
kind = "wasm"
module = "animate_dwellers"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "SpawnNextDweller"
kind = "input"
from = ["Active"]
params = ["dweller_ids", "check_count"]
hint = "Bounded self-loop: spawn the next chunk of dweller sessions under admission caps (ADR-0005). dweller_ids is set on the first tick (from DwellersCast) and persists across re-ticks; Cedar permits this action but not a raw World PATCH, so the roster rides as a param."
effect = [{ type = "trigger", name = "animate_dwellers" }]

[[action.triggers]]
name = "animate_dwellers"
kind = "wasm"
module = "animate_dwellers"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "AdjudicateNodes"
kind = "input"
from = ["Active"]
params = ["last_adjudication_date"]
hint = "Judged resolution for overdue authored nodes (ADR-004 commitment 2): spawn adjudicator sessions with snapshotted evidence; the module validates verdicts and owns Resolve. The caller supplies the as-of date — WASM has no clock."
effect = [{ type = "trigger", name = "adjudicate_nodes" }]

[[action.triggers]]
name = "adjudicate_nodes"
kind = "wasm"
module = "adjudicate_nodes"
on_failure = "Fail"

[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"


[[action]]
name = "BeginUpdate"
kind = "input"
from = ["Active"]
to = "Updating"
params = ["update_cause_node_id"]
hint = "Probability mass moved enough to demand re-solving. Cites the resolved EventNode that caused it."

[[action]]
name = "UpdateComplete"
kind = "input"
from = ["Updating"]
to = "Active"
params = ["canonical_path_id", "graph_snapshot_file_id"]
hint = "Re-solve finished: paths rescored, retcons dispatched, snapshot refreshed."

[[action]]
name = "Archive"
kind = "input"
from = ["Active"]
to = "Archived"
params = []
hint = "Retire the world. Read-only thereafter."

[[action]]
name = "Fail"
kind = "input"
from = ["Created", "Seeding", "Active", "Updating", "OpeningReplay"]
to = "Failed"
params = ["error_message"]
hint = "Unrecoverable error."

# --- Invariants ---

[[invariant]]
name = "ArchivedIsFinal"
when = ["Archived"]
assert = "no_further_transitions"

[[invariant]]
name = "FailedIsFinal"
when = ["Failed"]
assert = "no_further_transitions"

[[state]]
name = "learning_mode"
type = "string"
initial = "observed"

[[state]]
name = "model_json"
type = "string"
initial = ""

[[state]]
name = "adopted_learning_run_id"
type = "string"
initial = ""

[[action]]
name = "ConfigureLearning"
kind = "input"
from = ["Created"]
to = "Created"
params = ["learning_mode"]

[[action]]
name = "OpenReplay"
kind = "input"
from = ["Created"]
to = "OpeningReplay"
params = ["learning_mode","domain","frontier_date","last_ingest_date"]

[[action.triggers]]
name = "replay_open"
kind = "wasm"
module = "replay_open"
on_failure = "Fail"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "ReplayOpened"
kind = "input"
from = ["OpeningReplay"]
to = "Active"
params = []

[[state_timeout]]
state="OpeningReplay"
after_seconds=120
on_timeout="Fail"
params={error_message="Replay world initialization did not complete within 120 seconds."}

[[action]]
name = "RegisterForecasts"
kind = "input"
from = ["Active"]
to = "Active"
params = ["last_ingest_date"]

[[action.triggers]]
name = "learning_register_forecasts"
kind = "wasm"
module = "register_forecasts"
on_failure = "Fail"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "AdoptModel"
kind = "input"
from = ["Active"]
to = "Active"
params = ["expected_model_json","model_json","adopted_learning_run_id","learning_mode"]

[[action.constraints]]
kind="param_equals_field"
param="expected_model_json"
field="model_json"
[[action.constraints]]
kind="param_equals_field"
param="learning_mode"
field="learning_mode"

[[action.triggers]]
name = "confirm_model_adoption"
kind = "entity"
principal = "system"
target_entity = "LearningRun"
target_action = "ConfirmAdoption"

[action.triggers.resolve_target]
type = "field"
field = "adopted_learning_run_id"
[action.triggers.params_from]
