# Forecast — a preregistered marginal: the engine's public, gradeable word.
#
# Derived by register_forecasts from the weighted paths' inside-frontier
# claims. Immutable once created: there is deliberately NO action that can
# alter the question, probability, or resolve-by date. Resolution and
# scoring are evidence_ingest territory (Cedar: system principals only).
# This entity is the scoreboard — the entire credibility story rests on it.

[automaton]
name = "Forecast"
states = ["Preregistered", "Resolved", "Resolving", "Revising", "Scored"]
initial = "Preregistered"

# ADR-0050: Preregistered lives until its resolve_by date passes; resolution
# is driven by evidence_ingest reading the deadline as domain data, not by a
# state timeout. Resolved is transient (scored in the same ingest pass, but
# kept distinct so the outcome and its grading are separately auditable).
allow_indefinite_states = ["Preregistered", "Resolved"]

# --- State Variables ---

[[state]]
name = "world_id"
type = "string"
initial = ""

[[state]]
name = "event_node_id"
type = "string"
initial = ""

[[state]]
name = "question"
type = "string"
initial = ""

[[state]]
name = "probability"
type = "string"
initial = ""

[[state]]
name = "registered_at"
type = "string"
initial = ""

[[state]]
name = "resolve_by"
type = "string"
initial = ""

# Optional market reference this question maps to (ticker / slug).
[[state]]
name = "market_ref"
type = "string"
initial = ""

[[state]]
name = "engine_version"
type = "string"
initial = ""

# yes | no | void
[[state]]
name = "outcome"
type = "string"
initial = ""

[[state]]
name = "outcome_source_refs"
type = "string"
initial = "[]"

[[state]]
name = "brier"
type = "string"
initial = ""

# --- Actions ---

[[action]]
name = "Resolve"
kind = "input"
from = ["Preregistered"]
to = "Resolved"
params = ["outcome", "outcome_source_refs"]
hint = "Reality settled it. Dispatched by evidence_ingest with sources. System principals only (Cedar)."

[[action]]
name = "Score"
kind = "input"
from = ["Resolved"]
to = "Scored"
params = ["brier"]
hint = "Grade the registered probability against the outcome. System principals only (Cedar)."

[[action]]
name = "Void"
kind = "input"
from = ["Preregistered"]
to = "Scored"
params = ["outcome_source_refs"]
hint = "Question became unresolvable (ambiguous, superseded). Recorded, not graded. System principals only."

# --- Invariants ---

[[invariant]]
name = "ScoredIsFinal"
when = ["Scored"]
assert = "no_further_transitions"

[[state]]
name = "base_probability"
type = "string"
initial = ""

[[state]]
name = "model_version"
type = "string"
initial = ""

[[state]]
name = "learning_run_id"
type = "string"
initial = ""

[[state]]
name = "previous_forecast_id"
type = "string"
initial = ""

[[state]]
name = "evidence_kind"
type = "string"
initial = ""

[[state]]
name = "resolved_at"
type = "string"
initial = ""

[[state]]
name = "error_message"
type = "string"
initial = ""

[[state]]
name = "registration_key"
type = "string"
initial = ""

[[action]]
name = "RecordOutcome"
kind = "input"
from = ["Preregistered"]
to = "Resolving"
params = ["outcome","outcome_source_refs","resolved_at"]

[[action.triggers]]
name = "verify_forecast_outcome"
kind = "wasm"
module = "forecast_outcome"
on_failure = "OutcomeFailed"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "ResolveRevision"
kind = "input"
from = ["Preregistered"]
to = "Revising"
params = ["outcome","outcome_source_refs","resolved_at"]

[[action.triggers]]
name = "verify_revision_outcome"
kind = "wasm"
module = "forecast_outcome"
on_failure = "OutcomeFailed"
[action.triggers.config]
temper_api_url = "{secret:temper_api_url}"

[[action]]
name = "OutcomeVerified"
kind = "input"
from = ["Resolving"]
to = "Scored"
params = ["brier","error_message"]

[[action.triggers]]
name = "score_older_forecast_revision"
kind = "entity"
principal = "system"
target_entity = "Forecast"
target_action = "ResolveRevision"
guard = { type = "not", guard = {type = "field_equals", field = "previous_forecast_id", value = ""} }

[action.triggers.resolve_target]
type = "field"
field = "previous_forecast_id"
[action.triggers.params_from]
outcome = "outcome"
outcome_source_refs = "outcome_source_refs"
resolved_at = "resolved_at"

[[action.triggers]]
name = "learn_from_verified_outcome"
kind = "entity"
params = {dataset_json = ""}
principal = "system"
target_entity = "LearningRun"
target_action = "Start"

[action.triggers.resolve_target]
type = "create"

[action.triggers.params_from]
world_id = "world_id"
mode = "evidence_kind"
as_of = "resolved_at"

[[action]]
name = "RevisionVerified"
kind = "input"
from = ["Revising"]
to = "Scored"
params = ["brier","error_message"]

[[action.triggers]]
name = "score_previous_forecast_revision"
kind = "entity"
principal = "system"
target_entity = "Forecast"
target_action = "ResolveRevision"
guard = { type = "not", guard = {type = "field_equals", field = "previous_forecast_id", value = ""} }

[action.triggers.resolve_target]
type = "field"
field = "previous_forecast_id"
[action.triggers.params_from]
outcome = "outcome"
outcome_source_refs = "outcome_source_refs"
resolved_at = "resolved_at"

[[action]]
name = "OutcomeFailed"
kind = "input"
from = ["Resolving","Revising"]
to = "Preregistered"
params = ["error_message"]

[[state_timeout]]
state="Resolving"
after_seconds=120
on_timeout="OutcomeFailed"
params={error_message="Outcome validation did not complete within 120 seconds."}

[[state_timeout]]
state="Revising"
after_seconds=120
on_timeout="OutcomeFailed"
params={error_message="Outcome validation did not complete within 120 seconds."}
