# ARN-467. Executable IOA contract; simulator tests run these declarations unchanged.
[automaton]
name = "DsfObservation"
states = ["Draft","Measured","Absent","Inaccessible","Stale"]
initial = "Draft"
strict_action_params = true
# Durable records may wait indefinitely; work in progress has explicit timeouts.
allow_indefinite_states = ["Draft"]

[[state]]
name = "subject_type"
type = "string"
initial = ""

[[state]]
name = "subject_id"
type = "string"
initial = ""

[[state]]
name = "source"
type = "string"
initial = ""

[[state]]
name = "source_event_id"
type = "string"
initial = ""

[[state]]
name = "query"
type = "string"
initial = ""

[[state]]
name = "window_start"
type = "string"
initial = ""

[[state]]
name = "window_end"
type = "string"
initial = ""

[[state]]
name = "sample_kind"
type = "string"
initial = ""

[[state]]
name = "outcome"
type = "string"
initial = ""

[[state]]
name = "summary"
type = "string"
initial = ""

[[state]]
name = "evidence_ref"
type = "string"
initial = ""

[[state]]
name = "observed_at_ms"
type = "counter"
initial = "0"

[[state]]
name = "observed_configuration"
type = "string"
initial = ""

[[state]]
name = "observed_revision"
type = "string"
initial = ""

[[state]]
name = "expected_resource_sequence"
type = "counter"
initial = "0"

[[action]]
name = "RecordMeasured"
kind = "input"
from = ["Draft"]
to = "Measured"
params = [{ name = "subject_type", type = "string" }, { name = "subject_id", type = "string" }, { name = "source", type = "string" }, { name = "source_event_id", type = "string" }, { name = "query", type = "string" }, { name = "window_start", type = "string" }, { name = "window_end", type = "string" }, { name = "sample_kind", type = "string" }, { name = "outcome", type = "string" }, { name = "summary", type = "string" }, { name = "evidence_ref", type = "string" }, { name = "observed_at_ms", type = "counter" }]
effect = [{ type = "set_counter_from_param", var = "observed_at_ms", param = "observed_at_ms" }]

[[action.constraints]]
kind = "param_nonempty"
param = "subject_type"

[[action.constraints]]
kind = "param_nonempty"
param = "subject_id"

[[action.constraints]]
kind = "param_nonempty"
param = "source"

[[action.constraints]]
