# The review gate: no merge without a valid review record for this head.
# Vendor as .github/workflows/sdlc-review.yml.
#
# THE GATE VALIDATES; IT NEVER SPAWNS. The implementer agent owns the review the
# way it owns the effort: it runs the panel (interrogate locally, or
# stack/review/run-cloud-panel.py on a computer copy), aggregates, and posts the
# record to the PR (stack/review/post-review-record.sh). This gate checks that a
# record exists for the head being merged, applies any owner RESOLVE
# adjudications, validates it (panel complete, act-ons resolved), and routes:
# panel risk low -> auto-merge; anything else -> a human presses merge, reading
# the report. One guard: workflow-changing PRs always go to a human.
#
# A red gate with "no record" is an instruction to the owner, not a failure of
# the pipeline: run the panel, post the record. Rabbit-hole detection and the
# arbiter are the owner agent's tools (arni-mode babysit playbook), not CI steps.
name: sdlc-review
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
concurrency:
  group: sdlc-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write        # routing enables auto-merge
  pull-requests: write
  issues: write          # label create/apply is the Issues API
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with: { fetch-depth: 0 }
      - name: Fetch the review toolkit from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          if [ -z "${STACK_TOKEN:-}" ]; then
            echo "::error::STACK_TOKEN unavailable - fork PRs cannot run the gates; a maintainer re-pushes the branch in-repo"; exit 1; fi
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack"; exit 1; }
      - name: Ask Temper for ReviewRuns on this head
        env:
          SDLC_MIN_MODEL_REVIEWERS: ${{ vars.SDLC_MIN_MODEL_REVIEWERS }}
          TEMPER_API_KEY: ${{ secrets.TEMPER_API_KEY }}
          TEMPER_URL: ${{ vars.TEMPER_URL || 'https://openpaw-production.up.railway.app' }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, ssl
          key=os.environ.get("TEMPER_API_KEY") or ""
          url=os.environ["TEMPER_URL"].rstrip("/")
          head=os.environ["PR_HEAD"]
          if not key:
              print("::error::TEMPER_API_KEY missing - CI asks Temper, not a PR comment"); sys.exit(1)
          req=urllib.request.Request(
              f"{url}/tdata/ReviewRuns",
              headers={"Authorization":f"Bearer {key}","X-Tenant-Id":"default","Accept":"application/json"},
          )
          try:
              with urllib.request.urlopen(req, context=ssl.create_default_context(), timeout=60) as resp:
                  body=json.loads(resp.read().decode())
          except Exception as e:
              print(f"::error::Temper ReviewRuns read failed: {e}"); sys.exit(1)
          rows=body.get("value") if isinstance(body, dict) else body
          if not isinstance(rows, list):
              print("::error::Temper ReviewRuns response is not a list"); sys.exit(1)
          models={"grok","codex","fable"}
          fix_it_rows=[]
          ran=set(); usable=[]
          for row in rows:
              fields=row.get("fields") or row
              status=(fields.get("status") or fields.get("Status") or "")
              commit=(fields.get("commit") or fields.get("Commit") or "")
              if status!="Recorded" or commit!=head:
                  continue
              if fields.get("fix_it_failed") or fields.get("FixItFailed"):
                  # Carried into the record, not fatal here: an owner ruling
                  # (RESOLVE: fix-it <reason>) may clear it before the gate.
                  fix_it_rows.append(str(fields.get("id") or fields.get("Id") or "?"))
              raw=fields.get("findings") or fields.get("Findings") or "[]"
              try:
                  findings=json.loads(raw) if isinstance(raw,str) else raw
              except Exception:
                  findings=[]
              if any(isinstance(f,dict) and f.get("severity")=="act-on" and not f.get("resolved") for f in findings):
                  print("::error::open act-on on a Recorded ReviewRun"); sys.exit(1)
              usable.append(fields)
              rid=fields.get("reviewer_id") or fields.get("ReviewerId") or ""
              if rid: ran.add(rid)
              extra=fields.get("reviewers_ran") or fields.get("ReviewersRan") or "[]"
              try:
                  extra=json.loads(extra) if isinstance(extra,str) else extra
              except Exception:
                  extra=[]
              if isinstance(extra,list):
                  ran.update(str(x) for x in extra)
          # The floor is the model majority (2 of 3) unless the repo variable
          # SDLC_MIN_MODEL_REVIEWERS lowers it - never below 1, never above 2 -
          # for records written from the shared computer, where not every
          # reviewer CLI can be logged in (arni-labs/stack#24).
          floor_raw=(os.environ.get("SDLC_MIN_MODEL_REVIEWERS") or "").strip()
          try:
              floor=min(2,max(1,int(floor_raw))) if floor_raw else 2
          except ValueError:
              print(f"::error::SDLC_MIN_MODEL_REVIEWERS is not an integer: {floor_raw!r}"); sys.exit(1)
          if len(ran & models) < floor:
              print(f"::error::no Temper ReviewRuns for head {head[:10]} with a panel (ran={sorted(ran)}, floor {floor}). Write Recorded ReviewRuns; this gate does not read PR comments.")
              sys.exit(1)
          os.makedirs(".review",exist_ok=True)
          missing=sorted(models-ran)
          if missing: print(f"::warning::no Recorded ReviewRun for {missing} on head {head[:10]} (floor {floor} met by {sorted(ran & models)})")
          rec={"effort":"temper","repo":os.environ.get("GITHUB_REPOSITORY",""),"commit":head,
               "reviewers_ran":sorted(ran),
               "reviewers_skipped":[{"reviewer":m,"reason":"no Recorded ReviewRun for this head"} for m in missing],
               "findings":[],"synthesis_by":"temper-rows",
               "produced_by":{"tier":"temper"},"risk":"medium",
               "fix_it_failed":bool(fix_it_rows),"fix_it_rows":fix_it_rows}
          json.dump(rec, open(".review/review.json","w"))
          print(f"Temper ReviewRuns hold for this head ({len(usable)} rows, {sorted(ran)})")
          PY
      - name: Merge Greptile findings into the record
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          r=json.load(open(".review/review.json")); n=os.environ["PR_NUM"]; head=os.environ["PR_HEAD"]
          out=subprocess.run(["gh","api",f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/pulls/{n}/reviews",
                              "--paginate","-q",'.[] | select(.user.login|test("greptile";"i")) | .commit_id'],
                             capture_output=True,text=True).stdout
          if head in out:
              r.setdefault("reviewers_ran",[])
              if "greptile" not in r["reviewers_ran"]: r["reviewers_ran"].append("greptile")
          else:
              r.setdefault("reviewers_skipped",[]).append(
                  {"reviewer":"greptile","reason":"no Greptile review of this head yet"})
          json.dump(r,open(".review/review.json","w"),indent=2)
          PY
      - name: Apply owner adjudications (RESOLVE comments)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          n=os.environ["PR_NUM"]; head=os.environ["PR_HEAD"]
          # A ruling is a comment that BEGINS with RESOLVE: lines, written by the
          # repo owner or a member - anyone else's RESOLVE: is discussion. A
          # quoted RESOLVE: mid-comment is never a ruling: the first non-RESOLVE
          # line ends the rulings.
          raw=subprocess.run(["gh","api",f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/issues/{n}/comments",
                              "--paginate","-q",'.[] | select(.author_association=="OWNER" or .author_association=="MEMBER" or .author_association=="COLLABORATOR") | .body | @base64'],
                             capture_output=True,text=True).stdout
          import base64 as _b64
          comments=[_b64.b64decode(l).decode() for l in raw.split() if l]
          # A ruling is bound to one head: "RESOLVE: <target> @<sha-prefix> <reason>".
          # Without the @sha it is ignored, so a ruling on one head can never
          # silently clear a later one - the code after it has not been ruled on.
          resolutions={}
          for c in comments:
              if not c.strip().startswith("RESOLVE:"): continue
              for line in c.strip().splitlines():
                  m = re.match(r"RESOLVE:\s*(\S+)\s+@([0-9a-fA-F]{7,40})\s+(.+)$", line)
                  if not m:
                      if line.startswith("RESOLVE:"): print(f"ignored ruling without @<head-sha>: {line[:80]}")
                      break
                  if not head.lower().startswith(m.group(2).lower()):
                      print(f"ruling for another head ({m.group(2)}), ignored: {line[:80]}"); continue
                  resolutions[m.group(1)]=m.group(3).strip()
          if resolutions:
              r=json.load(open(".review/review.json")); hit=0
              for f in r.get("findings",[]):
                  fl=f.get("file_line","")
                  if fl in resolutions and not f.get("resolved"):
                      f["resolved"]=True; f["resolution"]=f"owner adjudication: {resolutions[fl]}"; hit+=1
              # "RESOLVE: fix-it <reason>" is the owner overruling the fix-it
              # rubric for this head. After the two-round cap it is how "merge"
              # becomes executable without forging a record; the reason stays
              # on the record.
              if "fix-it" in resolutions and r.get("fix_it_failed"):
                  r["fix_it_failed"]=False
                  r["fix_it_overruled"]=f"owner adjudication: {resolutions['fix-it']}"; hit+=1
              json.dump(r,open(".review/review.json","w"),indent=2)
              print(f"adjudications applied: {hit}")
          PY
      - name: Validate the record (the gate)
        id: validate
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Temper rows already applied the validate.py rules (panel, act-on, commit).
          # Do not re-parse a hidden PR comment.
          test -f .review/review.json
          python3 - <<'PY'
          import json, sys
          r=json.load(open(".review/review.json")); assert r.get("commit")
          if r.get("fix_it_failed"):
              print(f"::error::fix-it rubric failed on ReviewRun(s) {r.get('fix_it_rows')} and no owner ruling cleared it "
                    "(an OWNER/MEMBER comment beginning 'RESOLVE: fix-it <reason>' does)"); sys.exit(1)
          if r.get("fix_it_overruled"): print(f"fix-it overruled: {r['fix_it_overruled']}")
          PY
          echo "Temper review rows hold for $PR_HEAD"
      - name: Route on the panel's risk judgment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          RISK=$(python3 -c "import json; print(json.load(open('.review/review.json')).get('risk','high'))")
          CHANGED=$(git diff --name-only "origin/${PR_BASE_REF}...HEAD") \
            || { echo "::error::cannot diff against base - failing closed"; exit 1; }
          disarm() {
            # deterministic revoke: skip when nothing is armed, and any failure
            # to revoke an ARMED auto-merge is fatal - no message matching
            local armed
            armed=$(gh pr view "$PR_NUM" --json autoMergeRequest -q '.autoMergeRequest != null')
            [ "$armed" = "true" ] || return 0
            gh pr merge "$PR_NUM" --disable-auto || { echo "::error::auto-merge is armed and could not be revoked"; exit 1; }
          }
          if grep -q '^\.github/workflows/' <<<"$CHANGED"; then
            disarm
            gh label create human-review --color D93F0B --description "SDLC: routed to a human decision" 2>/dev/null || true
            gh pr edit "$PR_NUM" --add-label human-review 2>/dev/null || true
            echo "workflow files changed - a human presses merge"; exit 0; fi
          if [ "$RISK" = "low" ]; then
            gh pr merge "$PR_NUM" --squash --auto && echo "auto-merge enabled: panel risk low"
          else
            # an earlier low-risk run may have armed auto-merge; revoke it
            disarm
            gh pr edit "$PR_NUM" --add-label human-review 2>/dev/null || true
            echo "panel risk $RISK - a human presses merge"
          fi
      - name: Write the verdict to the job summary
        if: always()
        env:
          VALIDATED: ${{ steps.validate.outcome }}
        run: |
          # The verdict is the validate step's outcome, never a literal: a
          # record that exists but failed validation is a FAIL.
          if [ -f .review/review.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r=json.load(open(".review/review.json"))
          verdict="PASS" if os.environ.get("VALIDATED")=="success" else "FAIL"
          skipped=", ".join(s["reviewer"] for s in r.get("reviewers_skipped",[]))
          print(f"### Review {verdict}\nPanel: {', '.join(r.get('reviewers_ran',[]))}"
                + (f" (no row: {skipped})" if skipped else "")
                + f"\nrisk: {r.get('risk','?')}"
                + (f"\nfix-it overruled: {r['fix_it_overruled']}" if r.get("fix_it_overruled") else ""))
          PY
          fi
