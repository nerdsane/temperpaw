# Fork contributions are inspected as data; never execute their code in this workflow.
# The review gate: no merge without a valid review record for this head.
# Vendor as .github/workflows/sdlc-review.yml.
#
# THE GATE VALIDATES; IT NEVER SPAWNS. The implementer agent owns the review the
# way it owns the effort: it runs the panel (interrogate locally, or
# stack/review/run-cloud-panel.py on a computer copy), aggregates, and posts the
# record to the PR (stack/review/post-review-record.sh). This gate checks that a
# record exists for the head being merged, applies any owner RESOLVE
# adjudications, validates it (panel complete, act-ons resolved), and routes:
# Merge is owned by the authorized Temper effort; this validator never auto-merges.
#
# A red gate with "no record" is an instruction to the owner, not a failure of
# the pipeline: run the panel, post the record. Rabbit-hole detection and the
# arbiter are the owner agent's tools (arni-mode babysit playbook), not CI steps.
name: sdlc-review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, edited]
concurrency:
  group: sdlc-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: write          # label create/apply is the Issues API
jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Start the gate on the contributor commit
        id: contributor_check
        uses: actions/github-script@v7
        with:
          script: |
            const {data: check} = await github.rest.checks.create({
              ...context.repo, name: 'review',
              head_sha: context.payload.pull_request.head.sha,
              status: 'in_progress',
              details_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
            core.setOutput('check_id', check.id);
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Fetch contribution objects without checking out its code
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUM" =~ ^[0-9]+$ && "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/pull/${PR_NUM}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_HEAD" || {
            echo "::error::PR changed during this run; use the latest event"; exit 1;
          }
      - name: Fetch the review toolkit from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          if [ -z "${STACK_TOKEN:-}" ]; then
            echo "::error::STACK_TOKEN is missing from the trusted base-repository gate configuration"; exit 1; fi
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack"; exit 1; }
      - name: Ask Temper for ReviewRuns on this head
        env:
          TEMPER_API_KEY: ${{ secrets.TEMPER_API_KEY }}
          TEMPER_URL: ${{ vars.TEMPER_URL || 'https://openpaw-production.up.railway.app' }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, ssl
          key=os.environ.get("TEMPER_API_KEY") or ""
          url=os.environ["TEMPER_URL"].rstrip("/")
          head=os.environ["PR_HEAD"]
          if not key:
              print("::error::TEMPER_API_KEY missing - CI asks Temper, not a PR comment"); sys.exit(1)
          req=urllib.request.Request(
              f"{url}/tdata/ReviewRuns",
              headers={"Authorization":f"Bearer {key}","X-Tenant-Id":"default","Accept":"application/json"},
          )
          try:
              with urllib.request.urlopen(req, context=ssl.create_default_context(), timeout=60) as resp:
                  body=json.loads(resp.read().decode())
          except Exception as e:
              print(f"::error::Temper ReviewRuns read failed: {e}"); sys.exit(1)
          rows=body.get("value") if isinstance(body, dict) else body
          if not isinstance(rows, list):
              print("::error::Temper ReviewRuns response is not a list"); sys.exit(1)
          models={"grok","codex","fable"}
          ran=set(); usable=[]
          for row in rows:
              fields=row.get("fields") or row
              status=(fields.get("status") or fields.get("Status") or "")
              commit=(fields.get("commit") or fields.get("Commit") or "")
              if status!="Recorded" or commit!=head:
                  continue
              if fields.get("fix_it_failed") or fields.get("FixItFailed"):
                  print(f"::error::ReviewRun {fields.get('id') or fields.get('Id')} fix-it failed"); sys.exit(1)
              raw=fields.get("findings") or fields.get("Findings") or "[]"
              try:
                  findings=json.loads(raw) if isinstance(raw,str) else raw
              except Exception:
                  findings=[]
              if any(isinstance(f,dict) and f.get("severity")=="act-on" and not f.get("resolved") for f in findings):
                  print("::error::open act-on on a Recorded ReviewRun"); sys.exit(1)
              usable.append(fields)
              rid=fields.get("reviewer_id") or fields.get("ReviewerId") or ""
              if rid: ran.add(rid)
              extra=fields.get("reviewers_ran") or fields.get("ReviewersRan") or "[]"
              try:
                  extra=json.loads(extra) if isinstance(extra,str) else extra
              except Exception:
                  extra=[]
              if isinstance(extra,list):
                  ran.update(str(x) for x in extra)
          if len(ran & models) < 2:
              print(f"::error::no Temper ReviewRuns for head {head[:10]} with a panel (ran={sorted(ran)}). Write Recorded ReviewRuns; this gate does not read PR comments.")
              sys.exit(1)
          os.makedirs(".review",exist_ok=True)
          rec={"effort":"temper","repo":os.environ.get("GITHUB_REPOSITORY",""),"commit":head,
               "reviewers_ran":sorted(ran),"findings":[],"synthesis_by":"temper-rows",
               "produced_by":{"tier":"temper"},"risk":"medium"}
          json.dump(rec, open(".review/review.json","w"))
          print(f"Temper ReviewRuns hold for this head ({len(usable)} rows, {sorted(ran)})")
          PY
      - name: Merge Greptile findings into the record
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          r=json.load(open(".review/review.json")); n=os.environ["PR_NUM"]; head=os.environ["PR_HEAD"]
          out=subprocess.run(["gh","api",f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/pulls/{n}/reviews",
                              "--paginate","-q",'.[] | select(.user.login|test("greptile";"i")) | .commit_id'],
                             capture_output=True,text=True).stdout
          if head in out:
              r.setdefault("reviewers_ran",[])
              if "greptile" not in r["reviewers_ran"]: r["reviewers_ran"].append("greptile")
          else:
              r.setdefault("reviewers_skipped",[]).append(
                  {"reviewer":"greptile","reason":"no Greptile review of this head yet"})
          json.dump(r,open(".review/review.json","w"),indent=2)
          PY
      - name: Apply owner adjudications (RESOLVE comments)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          n=os.environ["PR_NUM"]
          raw=subprocess.run(["gh","api",f"repos/{os.environ.get('GITHUB_REPOSITORY','')}/issues/{n}/comments",
                              "--paginate","-q",".[].body | @base64"],capture_output=True,text=True).stdout
          import base64 as _b64
          comments=[_b64.b64decode(l).decode() for l in raw.split() if l]
          resolutions={}
          # an adjudication comment BEGINS with RESOLVE: (same contract as intake) -
          # a quoted RESOLVE: mid-comment is discussion, not a ruling
          for c in comments:
              if not c.strip().startswith("RESOLVE:"): continue
              # rulings are the comment's leading RESOLVE: lines only - the first
              # other line ends them, so quoted syntax below cannot adjudicate
              for line in c.strip().splitlines():
                  m = re.match(r"RESOLVE:\s*(\S+)\s+(.+)$", line)
                  if not m: break
                  resolutions[m.group(1)]=m.group(2).strip()
          if resolutions:
              r=json.load(open(".review/review.json")); hit=0
              for f in r.get("findings",[]):
                  fl=f.get("file_line","")
                  if fl in resolutions and not f.get("resolved"):
                      f["resolved"]=True; f["resolution"]=f"owner adjudication: {resolutions[fl]}"; hit+=1
              json.dump(r,open(".review/review.json","w"),indent=2)
              print(f"adjudications applied: {hit}")
          PY
      - name: Validate the record (the gate)
        id: validate
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Temper rows already applied the validate.py rules (panel, act-on, commit).
          # Do not re-parse a hidden PR comment.
          test -f .review/review.json
          python3 -c "import json; r=json.load(open('.review/review.json')); assert r.get('commit')"
          echo "Temper review rows hold for $PR_HEAD"
      - name: Write the verdict to the job summary
        if: always()
        run: |
          if [ -f .review/review.json ]; then
            python3 -c "import json; r=json.load(open('.review/review.json')); print(f\"### Review PASS\\nPanel: {', '.join(r.get('reviewers_ran',[]))}\\nrisk: {r.get('risk','?')}\")" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report this gate on the contributor commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const {data: current} = await github.rest.pulls.get({
              ...context.repo, pull_number: pr.number
            });
            if (current.head.sha !== pr.head.sha) {
              core.notice('PR head changed; this result cannot authorize the newer commit.');
              return;
            }
            const result = '${{ job.status }}';
            const checkId = Number('${{ steps.contributor_check.outputs.check_id }}');
            const report = {
              ...context.repo, name: 'review', head_sha: pr.head.sha,
              status: 'completed',
              conclusion: result === 'success' ? 'success' :
                result === 'cancelled' ? 'cancelled' : 'failure',
              details_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              output: {title: 'review', summary: 'Validated using trusted base-repository gate code.'}
            };
            if (checkId) {
              await github.rest.checks.update({...report, check_run_id: checkId});
            } else {
              await github.rest.checks.create(report);
            }
