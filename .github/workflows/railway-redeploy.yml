name: Railway Redeploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published GHCR tag to deploy: edge, latest, or sha-*"
        required: true
        default: edge
      expected_sha:
        description: "Optional full commit SHA expected from /paw/version"
        required: false
        default: ""
      base_url:
        description: "Optional base URL to verify; falls back to TEMPERPAW_BASE_URL secret/variable"
        required: false
        default: ""
      poll_attempts:
        description: "Number of readiness/version polling attempts"
        required: true
        default: "60"
      poll_seconds:
        description: "Seconds between polling attempts"
        required: true
        default: "10"
      run_artifact_batch_e2e:
        description: "Run PawFS ArtifactBatch production E2E after readiness/version proof"
        required: true
        default: "false"

permissions:
  contents: read

concurrency:
  group: deploy-temperpaw-production
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      BASE_URL_INPUT: ${{ inputs.base_url }}
      RUN_ARTIFACT_BATCH_E2E: ${{ inputs.run_artifact_batch_e2e }}
      TEMPERPAW_BASE_URL: ${{ secrets.TEMPERPAW_BASE_URL || vars.TEMPERPAW_BASE_URL }}
      POLL_ATTEMPTS: ${{ inputs.poll_attempts }}
      POLL_SECONDS: ${{ inputs.poll_seconds }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID || vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID || vars.RAILWAY_SERVICE_ID }}
      TEMPER_API_KEY: ${{ secrets.TEMPER_API_KEY }}
      RAILWAY_GRAPHQL_URL: https://backboard.railway.com/graphql/v2
    steps:
      - name: Validate inputs and secrets
        run: |
          set -euo pipefail

          # This value becomes a production source write, so the shape is
          # exact: edge, latest, or sha- followed by 7 to 40 lowercase hex.
          if ! [[ "${IMAGE_TAG}" =~ ^(edge|latest|sha-[0-9a-f]{7,40})$ ]]; then
            echo "image_tag must be edge, latest, or sha-<7..40 hex>" >&2
            exit 64
          fi
          # A sha-* tag and an expected sha must name the same build.
          if [ -n "${EXPECTED_SHA}" ] && [[ "${IMAGE_TAG}" == sha-* ]]; then
            short="${IMAGE_TAG#sha-}"
            if [ "${EXPECTED_SHA:0:${#short}}" != "${short}" ]; then
              echo "image_tag ${IMAGE_TAG} does not match expected_sha ${EXPECTED_SHA}" >&2
              exit 64
            fi
          fi

          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN secret is required" >&2
            exit 65
          fi
          if [ -z "${RAILWAY_PROJECT_ID}" ] || [ -z "${RAILWAY_ENVIRONMENT_ID}" ] || [ -z "${RAILWAY_SERVICE_ID}" ]; then
            echo "RAILWAY_PROJECT_ID, RAILWAY_ENVIRONMENT_ID, and RAILWAY_SERVICE_ID are required as secrets or variables" >&2
            exit 65
          fi
          base_url="${BASE_URL_INPUT:-${TEMPERPAW_BASE_URL:-}}"
          if [ -z "${base_url}" ]; then
            echo "base_url input or TEMPERPAW_BASE_URL secret/variable is required" >&2
            exit 65
          fi
          case "${base_url}" in
            http://*|https://*)
              ;;
            *)
              echo "base_url must start with http:// or https://" >&2
              exit 64
              ;;
          esac
          echo "BASE_URL=${base_url%/}" >> "${GITHUB_ENV}"

          if [ -n "${EXPECTED_SHA}" ] && [ -z "${TEMPER_API_KEY}" ]; then
            echo "TEMPER_API_KEY secret is required when expected_sha is provided" >&2
            exit 65
          fi
          if [ -n "${EXPECTED_SHA}" ] && ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full 40-character lowercase git SHA" >&2
            exit 64
          fi
          case "${RUN_ARTIFACT_BATCH_E2E}" in
            true|false)
              ;;
            *)
              echo "run_artifact_batch_e2e must be true or false" >&2
              exit 64
              ;;
          esac
          if [ "${RUN_ARTIFACT_BATCH_E2E}" = "true" ] && [ -z "${TEMPER_API_KEY}" ]; then
            echo "TEMPER_API_KEY secret is required when run_artifact_batch_e2e=true" >&2
            exit 65
          fi

          case "${POLL_ATTEMPTS}" in
            ''|*[!0-9]*)
              echo "poll_attempts must be an integer" >&2
              exit 64
              ;;
          esac
          case "${POLL_SECONDS}" in
            ''|*[!0-9]*)
              echo "poll_seconds must be an integer" >&2
              exit 64
              ;;
          esac

      - name: Set Railway deployment variables without implicit deploy
        run: |
          set -euo pipefail

          upsert_var() {
            local name="$1"
            local value="$2"

            response="$(jq -n \
              --arg projectId "${RAILWAY_PROJECT_ID}" \
              --arg environmentId "${RAILWAY_ENVIRONMENT_ID}" \
              --arg serviceId "${RAILWAY_SERVICE_ID}" \
              --arg name "${name}" \
              --arg value "${value}" \
              '{
                query: "mutation($input: VariableUpsertInput!) { variableUpsert(input: $input) }",
                variables: {
                  input: {
                    projectId: $projectId,
                    environmentId: $environmentId,
                    serviceId: $serviceId,
                    name: $name,
                    value: $value,
                    skipDeploys: true
                  }
                }
              }' | curl -fsS \
                -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
                -H "Content-Type: application/json" \
                --data @- \
                "${RAILWAY_GRAPHQL_URL}")"

            if jq -e '.errors' >/dev/null <<<"${response}"; then
              jq -r '.errors[0].message // "Railway variableUpsert failed"' <<<"${response}" >&2
              exit 1
            fi
          }

          upsert_var IMAGE_TAG "${IMAGE_TAG}"
          if [ -n "${EXPECTED_SHA}" ]; then
            build_version="sha-${EXPECTED_SHA:0:8}"
            upsert_var BUILD_SHA "${EXPECTED_SHA}"
            upsert_var BUILD_VERSION "${build_version}"
            upsert_var DD_VERSION "${build_version}"
            upsert_var OTEL_RESOURCE_ATTRIBUTES "service.name=temperpaw,service.version=${build_version},deployment.environment=prod,dd_llmobs_enabled=false"
          else
            upsert_var OTEL_RESOURCE_ATTRIBUTES "service.name=temperpaw,deployment.environment=prod,dd_llmobs_enabled=false"
          fi

      - name: Record the deployment that is live before the swap
        id: before
        run: |
          set -euo pipefail

          response="$(jq -n \
            --arg serviceId "${RAILWAY_SERVICE_ID}" \
            '{
              query: "query($serviceId: String!) { service(id: $serviceId) { serviceInstances { edges { node { environmentId source { image } latestDeployment { id status } } } } } }",
              variables: { serviceId: $serviceId }
            }' | curl -fsS \
              -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @- \
              "${RAILWAY_GRAPHQL_URL}")"

          if jq -e '.errors' >/dev/null <<<"${response}"; then
            jq -r '.errors[0].message // "Railway service lookup failed"' <<<"${response}" >&2
            exit 1
          fi

          node="$(jq -c --arg env "${RAILWAY_ENVIRONMENT_ID}" \
            '.data.service.serviceInstances.edges[].node | select(.environmentId == $env)' <<<"${response}")"
          if [ -z "${node}" ]; then
            echo "No service instance for environment ${RAILWAY_ENVIRONMENT_ID}" >&2
            exit 1
          fi

          before_image="$(jq -r '.source.image // empty' <<<"${node}")"
          before_deployment="$(jq -r '.latestDeployment.id // empty' <<<"${node}")"
          echo "before: image=${before_image:-none} deployment=${before_deployment:-none}"
          echo "deployment_id=${before_deployment}" >> "${GITHUB_OUTPUT}"

      - name: Set the service image
        run: |
          set -euo pipefail

          # The service source is a literal image reference. Redeploying the
          # previous deployment replays whatever image it was built from and
          # never consults IMAGE_TAG, which is how this workflow spent two days
          # reporting one tag while production ran another. Set the source.
          # Railway stages this change; it does not deploy on its own. The
          # next step starts the deployment explicitly.
          target="ghcr.io/nerdsane/temperpaw:${IMAGE_TAG}"

          response="$(jq -n \
            --arg serviceId "${RAILWAY_SERVICE_ID}" \
            --arg environmentId "${RAILWAY_ENVIRONMENT_ID}" \
            --arg image "${target}" \
            '{
              query: "mutation($serviceId: String!, $environmentId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }",
              variables: { serviceId: $serviceId, environmentId: $environmentId, input: { source: { image: $image } } }
            }' | curl -fsS \
              -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @- \
              "${RAILWAY_GRAPHQL_URL}")"

          if jq -e '.errors' >/dev/null <<<"${response}"; then
            jq -r '.errors[0].message // "Railway serviceInstanceUpdate failed"' <<<"${response}" >&2
            exit 1
          fi
          echo "service source set to ${target}"

      - name: Start the deployment
        run: |
          set -euo pipefail

          # Verified on the first live run of this workflow: after
          # serviceInstanceUpdate the instance sat for six polls with no new
          # deployment and a null status until this call was made.
          response="$(jq -n \
            --arg serviceId "${RAILWAY_SERVICE_ID}" \
            --arg environmentId "${RAILWAY_ENVIRONMENT_ID}" \
            '{ query: "mutation($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }",
               variables: { serviceId: $serviceId, environmentId: $environmentId } }' \
            | curl -fsS -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data @- "${RAILWAY_GRAPHQL_URL}")"

          if jq -e '.errors' >/dev/null <<<"${response}"; then
            jq -r '.errors[0].message // "Railway serviceInstanceDeployV2 failed"' <<<"${response}" >&2
            exit 1
          fi
          echo "deployment started: $(jq -r '.data.serviceInstanceDeployV2 // "ok"' <<<"${response}")"

      - name: Wait for a new deployment of that image to succeed
        env:
          BEFORE_DEPLOYMENT: ${{ steps.before.outputs.deployment_id }}
        run: |
          set -euo pipefail

          target="ghcr.io/nerdsane/temperpaw:${IMAGE_TAG}"

          # A transient API failure here must not abort the run: the source is
          # already set and the deployment already started, so a failed poll
          # is "not known yet", and it consumes one attempt like any other.
          lookup() {
            jq -n --arg serviceId "${RAILWAY_SERVICE_ID}" \
              '{
                query: "query($serviceId: String!) { service(id: $serviceId) { serviceInstances { edges { node { environmentId source { image } latestDeployment { id status } } } } } }",
                variables: { serviceId: $serviceId }
              }' | curl -fsS \
                -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
                -H "Content-Type: application/json" \
                --data @- \
                "${RAILWAY_GRAPHQL_URL}" \
              | jq -c --arg env "${RAILWAY_ENVIRONMENT_ID}" \
                  '.data.service.serviceInstances.edges[].node | select(.environmentId == $env)' \
              2>/dev/null || true
          }

          for attempt in $(seq 1 "${POLL_ATTEMPTS}"); do
            node="$(lookup)"
            if [ -z "${node}" ]; then
              echo "Attempt ${attempt}: Railway API did not answer; will retry"
              sleep "${POLL_SECONDS}"
              continue
            fi
            image="$(jq -r '.source.image // empty' <<<"${node}")"
            dep="$(jq -r '.latestDeployment.id // empty' <<<"${node}")"
            status="$(jq -r '.latestDeployment.status // empty' <<<"${node}")"

            if [ "${image}" = "${target}" ] && [ -n "${dep}" ] && [ "${dep}" != "${BEFORE_DEPLOYMENT}" ] && [ "${status}" = "SUCCESS" ]; then
              echo "deployment ${dep} of ${image} is SUCCESS"
              exit 0
            fi

            case "${status}" in
              FAILED|CRASHED|REMOVED)
                if [ "${dep}" != "${BEFORE_DEPLOYMENT}" ]; then
                  echo "deployment ${dep} ended ${status}" >&2
                  exit 1
                fi
                ;;
            esac

            echo "Attempt ${attempt}: image=${image:-none} deployment=${dep:-none} status=${status:-none}"
            sleep "${POLL_SECONDS}"
          done

          echo "no successful deployment of ${target} within ${POLL_ATTEMPTS} attempts" >&2
          exit 1

      - name: Verify the process serves, report readiness, check version if asked
        run: |
          set -euo pipefail

          # The deploy is proven by the previous step: Railway reports a new
          # deployment of the requested image as SUCCESS. This step proves the
          # process behind it answers. /healthz is the gate. /readyz is
          # reported but does not gate: it folds optional integrations into
          # the answer (a Discord credential expiring made it 503 for days and
          # failed every run of this workflow while deploys were fine).
          for attempt in $(seq 1 "${POLL_ATTEMPTS}"); do
            # Exactly 200. curl -f only fails at 400 and above, so a redirect
            # or other sub-400 answer would otherwise pass as healthy.
            health_code="$(curl -sS -o /dev/null -w '%{http_code}' "${BASE_URL%/}/healthz" || true)"
            if [ "${health_code:-000}" = "200" ]; then
              echo "/healthz 200 after ${attempt} attempt(s)"
              break
            fi
            echo "Attempt ${attempt}: /healthz ${health_code:-000}"
            if [ "${attempt}" -eq "${POLL_ATTEMPTS}" ]; then
              echo "/healthz never returned 200" >&2
              exit 1
            fi
            sleep "${POLL_SECONDS}"
          done

          # -w prints 000 itself on a transport failure; no second fallback.
          readyz_code="$(curl -sS -o /tmp/readyz.body -w '%{http_code}' "${BASE_URL%/}/readyz" || true)"
          readyz_code="${readyz_code:-000}"
          echo "/readyz ${readyz_code}: $(cat /tmp/readyz.body 2>/dev/null || echo '(no body)')"
          if [ "${readyz_code}" != "200" ]; then
            echo "::warning::/readyz is ${readyz_code} - an integration is degraded; the deploy itself succeeded"
          fi

          if [ -n "${EXPECTED_SHA}" ]; then
            # A 200 with no sha is the endpoint's known gap and warns; the
            # image assertion above is the proof. A rejected call is not a
            # missing sha - it is a failed check, and fails.
            version_code="$(curl -sS -o /tmp/version.body -w '%{http_code}' -H "Authorization: Bearer ${TEMPER_API_KEY}" "${BASE_URL%/}/paw/version" || true)"
            if [ "${version_code:-000}" != "200" ]; then
              echo "/paw/version returned ${version_code:-000}; cannot corroborate ${EXPECTED_SHA}" >&2
              exit 1
            fi
            live_sha="$(jq -r '.sha // empty' /tmp/version.body 2>/dev/null || true)"
            if [ "${live_sha}" = "${EXPECTED_SHA}" ]; then
              echo "version matches ${EXPECTED_SHA}"
            elif [ -z "${live_sha}" ]; then
              case "${IMAGE_TAG}" in
                sha-*)
                  # An immutable tag names the build; the image assertion is
                  # the proof and the missing sha is the endpoint's known gap.
                  echo "::warning::/paw/version is 200 but carries no sha; cannot confirm ${EXPECTED_SHA} that way - the sha-* image assertion above is the proof"
                  ;;
                *)
                  # edge/latest are mutable: the tag proves nothing about the
                  # build it resolved to, so with no sha there is no proof.
                  echo "/paw/version carries no sha and ${IMAGE_TAG} is a mutable tag; cannot prove ${EXPECTED_SHA} is what deployed" >&2
                  exit 1
                  ;;
              esac
            else
              echo "live version ${live_sha} does not match expected ${EXPECTED_SHA}" >&2
              exit 1
            fi
          fi

      - name: Check out repository for ArtifactBatch E2E
        if: ${{ inputs.run_artifact_batch_e2e == 'true' }}
        uses: actions/checkout@v6.0.2

      - name: Build packaged ArtifactBatch WASM for hash proof
        if: ${{ inputs.run_artifact_batch_e2e == 'true' }}
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          bash os-apps/paw-fs/wasm/artifact_batch_apply/build.sh

      - name: Run ArtifactBatch production E2E
        if: ${{ inputs.run_artifact_batch_e2e == 'true' }}
        env:
          TEMPER_BASE_URL: ${{ env.BASE_URL }}
          TEMPER_API_KEY: ${{ secrets.TEMPER_API_KEY }}
          TENANT_ID: default
          RUN_SUFFIX: gh-${{ github.run_id }}-${{ github.run_attempt }}
          PACKAGED_WASM_PATH: os-apps/paw-fs/wasm/artifact_batch_apply/artifact_batch_apply.wasm
        run: bash scripts/production_artifact_batch_e2e.sh
