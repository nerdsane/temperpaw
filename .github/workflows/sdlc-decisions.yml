# Fork contributions are inspected as data; never execute their code in this workflow.
# The decisions gate: no PR without a decision log (SDLC loop: the "decisions" stage). Vendor into a repo as
# .github/workflows/sdlc-decisions.yml. Reads the PR body, checks it carries a shaped
# '## Decisions & Tradeoffs' section (or an explicit 'No decisions'). Harness-
# agnostic, covers local and background/cloud agents, cannot be --no-verify'd.
name: sdlc-decisions
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  decision-log:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Start the gate on the contributor commit
        id: contributor_check
        uses: actions/github-script@v7
        with:
          script: |
            const {data: check} = await github.rest.checks.create({
              ...context.repo, name: 'decision-log',
              head_sha: context.payload.pull_request.head.sha,
              status: 'in_progress',
              details_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
            core.setOutput('check_id', check.id);
      - name: Fetch the gate from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          if [ -z "${STACK_TOKEN:-}" ]; then
            echo "::error::STACK_TOKEN is missing from the trusted base-repository gate configuration"; exit 1; fi
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack for the gate"; exit 1; }
      - name: Write PR body to a file
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > /tmp/pr-body.md
      - name: Check the decision log
        run: python3 /tmp/stack/gates/check-decision-log.py /tmp/pr-body.md
      - name: Report this gate on the contributor commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const {data: current} = await github.rest.pulls.get({
              ...context.repo, pull_number: pr.number
            });
            if (current.head.sha !== pr.head.sha) {
              core.notice('PR head changed; this result cannot authorize the newer commit.');
              return;
            }
            const result = '${{ job.status }}';
            const checkId = Number('${{ steps.contributor_check.outputs.check_id }}');
            const report = {
              ...context.repo, name: 'decision-log', head_sha: pr.head.sha,
              status: 'completed',
              conclusion: result === 'success' ? 'success' :
                result === 'cancelled' ? 'cancelled' : 'failure',
              details_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              output: {title: 'decision-log', summary: 'Validated using trusted base-repository gate code.'}
            };
            if (checkId) {
              await github.rest.checks.update({...report, check_run_id: checkId});
            } else {
              await github.rest.checks.create(report);
            }
